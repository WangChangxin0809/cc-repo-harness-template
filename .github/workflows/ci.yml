name: ci

# The server-side layer. The other two are the hooks in `.claude/settings.json`,
# which act while an agent is working, and `./ci.sh`, which acts before you push.
# This one is the only one nobody can skip, which is why a check that lives only
# on a laptop is the weakest of the three.
#
# It calls `./ci.sh` rather than restating what to run. A second roster drifts
# from the first, and the day it does, the laptop and the server disagree about
# whether the repository is sound.
#
# No path filters. A docs-only change is exactly what breaks the routing table
# and the community-health links, so "skip CI for docs" would skip the checks
# most likely to catch it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pushes to a pull request are cancelled. Pushes to main are not:
  # main's history is what every later bisect is measured against, and a
  # cancelled run leaves a commit nobody ever judged sitting in it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  harness:
    runs-on: ubuntu-latest
    # Seconds, not minutes. Anything near the ceiling has hung, and the default
    # six-hour limit turns a hang into a queue nobody notices.
    timeout-minutes: 10
    steps:
      # Actions are pinned by commit, not by tag: a tag is mutable, so an action
      # referenced by tag is a standing promise from whoever can move it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # checkout leaves the job's token in .git/config unless told not to,
          # where every later step -- and anything a later step runs -- can read
          # it. Nothing here needs to push.
          persist-credentials: false

      # The harness is Python with no dependencies. Your project's own toolchain
      # goes in a second job, or in `./ci.sh`'s unit lane.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # First, and on its own: a suite whose checks have stopped being able to
      # fail reports a clean build forever.
      - name: the checks can still turn red
        run: |
          python3 scripts/guards/selftest.py
          python3 scripts/gates/selftest.py
          python3 scripts/context/selftest.py

      # Exit 2 -- could not judge -- fails the step, and that is correct. It is
      # never a pass.
      - name: the repository is sound
        run: ./ci.sh
